# Firebase App Hosting runtime configuration for the JaMed backend.
runConfig:
  cpu: 2
  memoryMiB: 2048
  concurrency: 4
  maxInstances: 3
  minInstances: 0

scripts:
  buildCommand: npm run build
  runCommand: npm run start

outputFiles:
  serverApp:
    include:
      - .

env:
  - variable: JAMED_ALLOWED_HOSTS
    value: "*"
    availability:
      - RUNTIME
