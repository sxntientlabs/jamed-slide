# Firebase App Hosting runtime configuration for the JaMed backend.
runConfig:
  cpu: 2
  memoryMiB: 2048
  concurrency: 4
  maxInstances: 3
  minInstances: 0

scripts:
  buildCommand: npm run build
  runCommand: npm run start

outputFiles:
  serverApp:
    include:
      - .

env:
  - variable: JAMED_AI_BASE_URL
    value: "https://rcljvh2.abc-tunnel.us/v1"
    availability:
      - RUNTIME
  - variable: JAMED_AI_MODEL
    value: "cx/gpt-5.6-luna"
    availability:
      - RUNTIME
  - variable: JAMED_ALLOWED_HOSTS
    value: "*"
    availability:
      - RUNTIME
  - variable: JAMED_AI_API_KEY
    secret: jamed-ai-api-key
    availability:
      - RUNTIME
