# Firebase App Hosting runtime configuration for the Koasis backend.
runConfig:
  cpu: 2
  memoryMiB: 2048
  concurrency: 4
  maxInstances: 3
  minInstances: 0

scripts:
  buildCommand: npm run build
  runCommand: npm run start

outputFiles:
  serverApp:
    include:
      - .

env:
  - variable: JAMED_ALLOWED_HOSTS
    value: "*"
    availability:
      - RUNTIME
  # The browser uses App Hosting's same-origin /api routes for lightweight
  # operations. Heavy renderer work stays on the Dokploy VPS.
  - variable: JAMED_RENDERER_URL
    value: "https://server.eltexlabs.com/koasis-renderer"
    availability:
      - RUNTIME
  # Computer state and Instabox calls run in the Dokploy backend, which can
  # reach the private PostgreSQL service without exposing the database.
  - variable: VITE_KOASIS_COMPUTER_API_BASE_URL
    value: "https://server.eltexlabs.com/koasis-app"
    availability:
      - BUILD
  # Agent Computer calls from App Hosting use the same protected Dokploy API.
  - variable: KOASIS_INTERNAL_URL
    value: "https://server.eltexlabs.com/koasis-app"
    availability:
      - RUNTIME
  # InstaBox credentials and lifecycle flags belong only to the Dokploy
  # Koasis App runtime; they must never be sent to the browser bundle.
