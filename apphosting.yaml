# Firebase App Hosting runtime configuration for the Koasis backend.
runConfig:
  cpu: 2
  memoryMiB: 2048
  concurrency: 4
  maxInstances: 3
  minInstances: 0

scripts:
  buildCommand: npm run build
  runCommand: npm run start

outputFiles:
  serverApp:
    include:
      - .

env:
  - variable: JAMED_ALLOWED_HOSTS
    value: "*"
    availability:
      - RUNTIME
  - variable: VITE_KOASIS_API_BASE_URL
    value: "https://server.eltexlabs.com/koasis-app"
    availability:
      - BUILD
