# Firebase App Hosting runtime configuration for the Koasis backend.
runConfig:
  cpu: 2
  memoryMiB: 2048
  concurrency: 4
  maxInstances: 3
  minInstances: 0

scripts:
  buildCommand: npm run build
  runCommand: npm run start

outputFiles:
  serverApp:
    include:
      - .

env:
  - variable: JAMED_ALLOWED_HOSTS
    value: "*"
    availability:
      - RUNTIME
  # The browser uses App Hosting's same-origin /api routes. The renderer is
  # the only heavy service that App Hosting calls on the Dokploy VPS.
  - variable: JAMED_RENDERER_URL
    value: "https://server.eltexlabs.com/koasis-renderer"
    availability:
      - RUNTIME
