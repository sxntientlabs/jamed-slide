# Firebase App Hosting runtime configuration for the Koasis backend.
runConfig:
  cpu: 2
  memoryMiB: 2048
  concurrency: 4
  maxInstances: 3
  minInstances: 0

scripts:
  buildCommand: npm run build
  runCommand: npm run start

outputFiles:
  serverApp:
    include:
      - .

env:
  - variable: JAMED_ALLOWED_HOSTS
    value: "*"
    availability:
      - RUNTIME
  # The browser uses App Hosting's same-origin /api routes. The renderer is
  # the only heavy service that App Hosting calls on the Dokploy VPS.
  - variable: JAMED_RENDERER_URL
    value: "https://server.eltexlabs.com/koasis-renderer"
    availability:
      - RUNTIME
  # Add INSTABOX_API_KEY yourself in the Firebase App Hosting Environment
  # settings. It must never be a VITE_* variable or appear in the browser
  # bundle.
  - variable: INSTABOX_API_URL
    value: "https://api.instabox.sh"
    availability:
      - RUNTIME
  - variable: INSTABOX_TEMPLATE
    value: "agent-browser"
    availability:
      - RUNTIME
  - variable: INSTABOX_ALLOW_PROVISIONING
    value: "false"
    availability:
      - RUNTIME
  - variable: INSTABOX_MACHINE_TIMEOUT_MS
    value: "14400000"
    availability:
      - RUNTIME
  - variable: INSTABOX_AUTO_SUSPEND_MS
    value: "1800000"
    availability:
      - RUNTIME
