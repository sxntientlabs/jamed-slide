services:
  koasis-agent:
    build:
      # The Dockerfile copies the fork profile from the repository root so the
      # Agent image and the app can be built from the same Dokploy source.
      context: .
      dockerfile: koasis-agent/Dockerfile
      args:
        HERMES_REF: ${HERMES_REF:-v2026.9.24}
    image: ${KOASIS_AGENT_IMAGE:-koasis-agent:local}
    restart: unless-stopped
    environment:
      HERMES_HOME: /opt/data
      KOASIS_AGENT_API_KEY: ${KOASIS_AGENT_API_KEY:?set KOASIS_AGENT_API_KEY}
      KOASIS_AGENT_MODEL: ${KOASIS_AGENT_MODEL:-koasis-agent}
      KOASIS_AGENT_CONTEXT_LENGTH: ${KOASIS_AGENT_CONTEXT_LENGTH:-65536}
      KOASIS_AGENT_MAX_TURNS: ${KOASIS_AGENT_MAX_TURNS:-12}
      KOASIS_AGENT_RUN_BUDGET_SECONDS: ${KOASIS_AGENT_RUN_BUDGET_SECONDS:-480}
      KOASIS_AGENT_COMPUTER_ENABLED: ${KOASIS_AGENT_COMPUTER_ENABLED:-true}
      KOASIS_AGENT_DESKTOP_GEOMETRY: ${KOASIS_AGENT_DESKTOP_GEOMETRY:-1440x900}
      KOASIS_AGENT_DESKTOP_MIN_FREE_MEMORY_MB: ${KOASIS_AGENT_DESKTOP_MIN_FREE_MEMORY_MB:-1024}
      KOASIS_AGENT_DESKTOP_IDLE_MINUTES: ${KOASIS_AGENT_DESKTOP_IDLE_MINUTES:-30}
      # Keep web_extract on a provider that supports extraction. ddgs is
      # intentionally search-only, so leaving this unset would break URL reads
      # after the image installs ddgs for web discovery.
      KOASIS_AGENT_WEB_BACKEND: ${KOASIS_AGENT_WEB_BACKEND:-firecrawl}
      KOASIS_AGENT_WEB_SEARCH_BACKEND: ${KOASIS_AGENT_WEB_SEARCH_BACKEND:-firecrawl}
      KOASIS_AGENT_WEB_EXTRACT_BACKEND: ${KOASIS_AGENT_WEB_EXTRACT_BACKEND:-firecrawl}
      KOASIS_AGENT_WEB_KEYLESS_FALLBACK: ${KOASIS_AGENT_WEB_KEYLESS_FALLBACK:-true}
      KOASIS_AGENT_WEB_EXTRACT_TIMEOUT: ${KOASIS_AGENT_WEB_EXTRACT_TIMEOUT:-45}
      KOASIS_AGENT_WEB_EXTRACT_CHAR_LIMIT: ${KOASIS_AGENT_WEB_EXTRACT_CHAR_LIMIT:-20000}
      # Optional provider credentials stay server-side. The defaults remain
      # keyless Firecrawl, so these are only needed for a paid/provider pin.
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      KEENABLE_API_KEY: ${KEENABLE_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      KOASIS_PROVIDER_API_KEY: ${KOASIS_PROVIDER_API_KEY:?set KOASIS_PROVIDER_API_KEY}
      KOASIS_PROVIDER_BASE_URL: ${KOASIS_PROVIDER_BASE_URL:?set KOASIS_PROVIDER_BASE_URL}
    expose:
      - "8642"
    volumes:
      - koasis-agent-data:/opt/data
    networks:
      - koasis-internal

  koasis-app:
    build:
      context: .
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_KOASIS_BASE_PATH: ${VITE_KOASIS_BASE_PATH:-/}
        VITE_KOASIS_API_BASE_URL: ${VITE_KOASIS_API_BASE_URL:-}
        VITE_KOASIS_COMPUTER_API_BASE_URL: ${VITE_KOASIS_COMPUTER_API_BASE_URL:-}
    image: ${KOASIS_APP_IMAGE:-koasis-app:local}
    restart: unless-stopped
    depends_on:
      koasis-agent:
        condition: service_healthy
    environment:
      PORT: "8080"
      KOASIS_AGENT_RUNTIME: hermes
      KOASIS_COMPUTER_RUNTIME: ${KOASIS_COMPUTER_RUNTIME:-vps}
      KOASIS_HERMES_API_URL: http://koasis-agent:8642
      KOASIS_HERMES_API_KEY: ${KOASIS_AGENT_API_KEY:?set KOASIS_AGENT_API_KEY}
      KOASIS_HERMES_MODEL: ${KOASIS_AGENT_MODEL:-koasis-agent}
      KOASIS_HERMES_PERSISTENCE: "true"
      KOASIS_POSTGRES_URL: ${KOASIS_POSTGRES_URL:?set KOASIS_POSTGRES_URL}
      KOASIS_POSTGRES_SSL: ${KOASIS_POSTGRES_SSL:-false}
      KOASIS_POSTGRES_MAX_CONNECTIONS: ${KOASIS_POSTGRES_MAX_CONNECTIONS:-5}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      KOASIS_ADMIN_PASSWORD: ${KOASIS_ADMIN_PASSWORD:-}
      KOASIS_ADMIN_SESSION_SECRET: ${KOASIS_ADMIN_SESSION_SECRET:-}
      KOASIS_WEB_SEARCH_API_KEY: ${KOASIS_WEB_SEARCH_API_KEY:-}
      KOASIS_WEB_SEARCH_PROVIDER: ${KOASIS_WEB_SEARCH_PROVIDER:-brave}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      NCBI_CONTACT_EMAIL: ${NCBI_CONTACT_EMAIL:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      INSTABOX_API_KEY: ${INSTABOX_API_KEY:-}
      INSTABOX_API_URL: ${INSTABOX_API_URL:-https://api.instabox.sh}
      INSTABOX_SHARED_MACHINE_IDS: ${INSTABOX_SHARED_MACHINE_IDS:-koasis-alpha,koasis-beta,koasis-delta,koasis-sigma,koasis-omega}
      INSTABOX_ALLOW_PROVISIONING: ${INSTABOX_ALLOW_PROVISIONING:-false}
      INSTABOX_ALLOW_AGENT_CONTROL: ${INSTABOX_ALLOW_AGENT_CONTROL:-false}
    ports:
      - "${KOASIS_APP_PORT:-8080}:8080"
    networks:
      - koasis-internal

networks:
  koasis-internal:
    driver: bridge

volumes:
  koasis-agent-data:
